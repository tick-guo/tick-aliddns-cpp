name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release
  BUILD_Platform: x64

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    #- name: Restore NuGet packages
    #  working-directory: ${{env.GITHUB_WORKSPACE}}
    #  run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: 组装版本号
      shell: cmd
      # 设置到变量 $GITHUB_ENV
      run: |
        echo 组装版本号
        bash ./update_build_date.sh
        bash ./bashtool.sh
        
    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: cmd
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: |
        rem 指定源码字符集GBK，执行字符集默认
        set CL=/source-charset:gbk
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}};Platform=${{env.BUILD_Platform}} ${{env.SOLUTION_FILE_PATH}}

    - name: 打包产物
      shell: cmd
      run: |
        echo %cd%
        dir /s x64
        echo 打包产物
        7z  a -tzip ${{env.zip_name}}.zip  .\x64\Release\*.exe

  
    - name : 编译产物
      uses: actions/upload-artifact@v7
      if: true
      with:
        name: ${{env.zip_name}}
        path: x64

    - name: 发布到Release
      if: true
      uses: softprops/action-gh-release@v2
      with:
        name: ${{env.name}}
        tag_name: ${{env.tag_name}}
        draft: true
        prerelease: false
        files: ${{env.VS_DIR}}/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
        
